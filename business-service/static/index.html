<!DOCTYPE html>
<html lang="zh-CN" id="app-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务管理</title>
<style>
[hidden] { display: none !important; }
a.btn { text-decoration: none; }
.table-scroll { overflow-x: auto; }
:root {
  --primary: #1890ff;
  --bg: #f0f2f5;
  --bg-card: #fff;
  --text: #333;
  --text-secondary: #666;
  --border: #e8e8e8;
  --radius: 6px;
  --font-size: var(--font-size);
}
html.dark {
  --bg: #141414;
  --bg-card: #1f1f1f;
  --text: #e8e8e8;
  --text-secondary: #999;
  --border: #333;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  font-size: var(--font-size);
  height: 100vh; overflow: auto;
  transition: background 0.3s, color 0.3s;
}
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.top-bar h1 { font-size: 20px; font-weight: 600; }
.top-bar .pill {
  font-size: 12px; padding: 2px 10px; border-radius: 10px;
  background: var(--primary); color: #fff;
}
.top-bar .stats { font-size: 13px; color: var(--text-secondary); }
.card {
  background: var(--bg-card); border-radius: var(--radius); padding: 20px;
  margin-bottom: 16px; border: 1px solid var(--border);
  transition: background 0.3s, border-color 0.3s;
}
.card h2 { font-size: 16px; margin-bottom: 12px; }
.card p { color: var(--text-secondary); font-size: var(--font-size); line-height: 1.6; }
.endpoint { font-family: monospace; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: var(--font-size); }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--text-secondary); font-size: 12px; text-transform: uppercase; }
.status-badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius); font-size: 12px; }
.status-badge.published { background: var(--primary-bg, #e6f7ff); color: var(--primary); }
.status-badge.draft { background: #f5f5f5; color: #999; }
.dark .status-badge.published { background: rgba(24,144,255,0.2); }
.dark .status-badge.draft { background: rgba(255,255,255,0.1); }
.empty { text-align: center; padding: 40px 0; color: var(--text-secondary); }
.error-msg { color: #ff4d4f; font-size: var(--font-size); margin-top: 8px; }
.success-msg { color: #52c41a; font-size: var(--font-size); margin-top: 8px; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: flex-start; }
input, select {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text); font-size: var(--font-size);
  transition: border-color 0.2s;
}
input:focus, select:focus { outline: none; border-color: var(--primary); }
input[type="text"] { flex: 1; min-width: 200px; }
.btn {
  padding: 6px 16px; border: none; border-radius: var(--radius); cursor: pointer;
  font-size: var(--font-size); background: var(--primary); color: #fff; white-space: nowrap;
}
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.danger { background: #ff4d4f; }
.btn.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-bar label { font-size: 13px; color: var(--text-secondary); }
.loading { text-align: center; padding: 20px; color: var(--text-secondary); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
.actions { display: flex; gap: 6px; }
.actions .btn { padding: 2px 10px; font-size: 12px; }
.edit-form { margin: 12px 0; padding: 12px; background: var(--bg); border-radius: 6px; display: none; }
.edit-form.visible { display: block; }
.pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.pagination .btn { padding: 2px 12px; font-size: 12px; }
</style>
</head>
<body>

<div class="top-bar">
  <h1 style="display:flex;align-items:center;gap:8px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M3 3h7v7H3V3zM14 3h7v7h-7V3zM3 14h7v7H3v-7zM14 14h7v7h-7v-7z"/></svg>
    业务管理
  </h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="stats" id="statsInfo"></span>
    <span class="pill" id="statusPill">连接中</span>
  </div>
</div>

<div class="card" id="connectionPanel" role="status">
  <p id="connectionText">正在连接 AdminX 平台…</p>
  <div class="actions" style="margin-top:12px">
    <button class="btn" id="connectBtn">重新连接</button>
    <a class="btn outline" id="platformLink" target="_top">进入平台</a>
  </div>
</div>
<div class="card" id="businessPanel" hidden>
  <div class="filter-bar"><label for="platformMenu">前往：</label><select id="platformMenu"><option value="">选择平台页面</option></select><button class="btn outline" id="navigateBtn">跳转</button></div>
  <h2>📋 文章管理</h2>

  <div class="form-row">
    <input type="text" id="titleInput" placeholder="文章标题" maxlength="100" />
    <input type="text" id="contentInput" placeholder="文章内容" maxlength="500" />
    <select id="statusSelect">
      <option value="draft">草稿</option>
      <option value="published">已发布</option>
    </select>
    <button class="btn" id="createBtn">新建</button>
  </div>

  <div class="filter-bar">
    <label>筛选：</label>
    <select id="filterStatus">
      <option value="">全部状态</option>
      <option value="draft">草稿</option>
      <option value="published">已发布</option>
    </select>
    <input type="text" id="searchInput" placeholder="搜索标题..." style="width:160px;padding:4px 8px;font-size:13px;" />
    <button class="btn outline" id="searchBtn" style="padding:2px 12px;font-size:12px;">搜索</button>
  </div>

  <div id="postList"><div class="loading"><span class="spinner"></span>加载中...</div></div>

  <div class="pagination" id="paginationBar" style="display:none;">
    <span id="pageInfo"></span>
    <div>
      <button class="btn outline" id="prevBtn" style="padding:2px 12px;font-size:12px;">← 上一页</button>
      <button class="btn outline" id="nextBtn" style="padding:2px 12px;font-size:12px;">下一页 →</button>
    </div>
  </div>

  <div class="error-msg" role="alert" id="errorMsg"></div>
  <div class="success-msg" role="status" id="successMsg"></div>
</div>

<script id="adminx-config" type="application/json">__ADMINX_CONFIG__</script>
<script src="./static/adminx-bridge.js"></script>
<script src="./static/app.js" defer></script>
</body>
</html>
