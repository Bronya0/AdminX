version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: djangoadminx
      POSTGRES_USER: djangoadminx
      POSTGRES_PASSWORD: djangoadminx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangoadminx"]
      interval: 5s
      timeout: 3s
      retries: 5

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "False"
      DATABASE_URL: postgres://djangoadminx:djangoadminx@postgres:5432/djangoadminx
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - logs:/app/logs
    ports:
      - "8000:8000"

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "False"
      DATABASE_URL: postgres://djangoadminx:djangoadminx@postgres:5432/djangoadminx
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "*"
    command: python manage.py run_scheduler
    volumes:
      - logs:/app/logs

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - django
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro

volumes:
  redis_data:
  postgres_data:
  staticfiles:
  media:
  logs:
