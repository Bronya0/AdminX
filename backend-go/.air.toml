# air 热重载配置（本地开发用）：改 .go 或 configs 下的 yaml 自动重编译重启，
# 不用再手动 stop/start 服务。
#
# 安装：go install github.com/air-verse/air@latest
# 启动：air -- --config ../.tmp/dev-config.yaml
#       （`--` 之后的参数原样传给后端进程，配置文件按自己的环境传即可）
#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
# 编译产物放工作区 .tmp/（已 gitignore），不污染仓库
tmp_dir = "../.tmp/air"

[build]
  args_bin = []
  bin = "../.tmp/air/server"
  cmd = "go build -o ../.tmp/air/server ./cmd/server"
  delay = 500
  entrypoint = ["../.tmp/air/server"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "scripts"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  # 配置改完也要重启：否则改了 yaml 以为生效，实际跑的还是旧配置
  include_ext = ["go", "yaml", "yml"]
  include_file = []
  # 给 HTTP 服务和调度器留出优雅退出的时间，避免端口被上一个进程占着
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  # 先发 SIGTERM 走优雅停止（调度器 Stop 会取消任务 context，shell 子进程不会变孤儿）
  send_interrupt = true
  # 编译报错时保留上一个进程继续跑，改到一半服务不断
  stop_on_error = false

  [build.windows]
    args_bin = []
    bin = "..\\.tmp\\air\\server.exe"
    cmd = "go build -o ../.tmp/air/server.exe ./cmd/server"
    entrypoint = ["..\\.tmp\\air\\server.exe"]
    full_bin = ""
    post_cmd = []
    pre_cmd = []

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  # 带时间戳：热重载时能看出这次重启发生在哪一刻
  time = true

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
