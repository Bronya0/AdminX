# ── 负载均衡 upstream ──────────────────────────────────────────────
#
# 单节点（Docker Compose 默认）：只保留 server django:9999
# 多节点集群：替换为真实节点 IP/端口，并按需调整负载策略。
#
# 负载策略（任选其一，默认 least_conn）：
#   least_conn        — 优先转发给连接数最少的节点（推荐，长连接友好）
#   ip_hash           — 同一客户端固定到同一节点（WebSocket sticky 场景才需要）
#   （不写）          — 加权轮询
#
# 健康检查（被动）：
#   max_fails=N fail_timeout=T  — T 秒内失败 N 次则标记不可用，T 秒后重试
#   backup                       — 仅当所有主节点都挂了才启用
#
# upstream django_backend {
#     least_conn;
#
#     # 主节点池
#     server 10.0.1.10:8000 max_fails=3 fail_timeout=30s;
#     server 10.0.1.11:8000 max_fails=3 fail_timeout=30s;
#
#     # 备用节点（主节点全挂时才接管）
#     server 10.0.1.12:8000 backup;
#
#     keepalive 32;
# }
upstream django_backend {
    server django:9999 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=djangoadminx_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # AdminX 专属入口，避免占用全局 /
    location = /djangoadminx {
        return 301 /djangoadminx/;
    }

    # 前端静态资源 —— 前端已分离到独立目录，此处默认注释。
    # 如需由本 nginx 托管前端 dist，把 FRONTEND_DIST 改为实际路径（如 /app/adminx-ui/dist）。
    # location ^~ /djangoadminx/assets/ {
    #     alias /app/adminx-ui/dist/assets/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    #     try_files $uri =404;
    # }

    # location = /djangoadminx/favicon.ico {
    #     alias /app/adminx-ui/dist/favicon.ico;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }

    # Django 静态文件
    location ^~ /djangoadminx/static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location ^~ /djangoadminx/media/ {
        alias /app/media/;
        expires 30d;
    }

    # API: 外部 /djangoadminx/api/... -> 后端 /api/...
    location ^~ /djangoadminx/api/ {
        limit_req zone=djangoadminx_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://django_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin: 保留专属入口，避免占用 /admin/
    location ^~ /djangoadminx/admin/ {
        proxy_pass http://django_backend/admin/;
        proxy_redirect /admin/ /djangoadminx/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location ^~ /djangoadminx/ws/ {
        proxy_pass http://django_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /djangoadminx/health/ {
        proxy_pass http://django_backend/api/v1/common/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue history 路由 fallback —— 前端已分离，默认注释。
    # 如需由本 nginx 托管前端 SPA，取消注释并填实际 dist 路径。
    # location ^~ /djangoadminx/ {
    #     alias /app/adminx-ui/dist/;
    #     try_files $uri $uri/ /djangoadminx/index.html;
    # }
}
