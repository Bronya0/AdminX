# ── 调度器 Standby 节点 supervisor 配置 ────────────────────────────
#
# 用途：在第二台机器上部署调度器 standby 实例，与主节点的 scheduler
#       形成 Active-Standby HA。两台都跑 run_scheduler，通过 Redis
#       分布式锁自动选举 leader —— 只有抢到锁的那台真正执行任务。
#
# 部署方式：把本文件放到第二台机器（如 10.0.1.11），supervisor 读取它：
#   sudo cp deploy/docker/supervisor-scheduler-standby.conf /etc/supervisor/conf.d/
#   sudo supervisorctl update
#   sudo supervisorctl status djangoadminx-scheduler-standby
#
# 前提：该机器必须与主节点共享同一 Redis + PostgreSQL（REDIS_URL / DATABASE_URL 一致）。
#       无 Redis 时调度器会降级为单机模式（无 HA，此时两台都会执行任务，不要这样部署）。
#
# 主节点配置见 supervisor.conf 里的 [program:djangoadminx-scheduler]。

[program:djangoadminx-scheduler-standby]
command=/app/.venv/bin/python manage.py run_scheduler
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/scheduler-standby.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

# 优雅退出：收到 SIGTERM 时先释放 Redis 锁，让主节点立即感知并触发 failover
stopsignal=TERM
stopwaitsecs=10
